name: Release Go Application

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Triggers the workflow on any tag starting with v (e.g., v1.0.0, v2.1.3-beta)

permissions:
  contents: write # Crucial permission required to create the release and upload assets

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod' # Dynamically reads the Go version specified in your go.mod file
          cache: true               # Enables automatic caching of Go modules to speed up subsequent runs

      - name: Install Dependencies
        run: go mod download

#     - name: Run Tests
#        run: go test -v ./...

      - name: Build Binaries (Cross-Platform Execution)
        run: |
          # Replace 'myapp' with your actual binary name
          # Compiles binaries for Linux, macOS, and Windows
          
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/nut_exporter-linux-amd64 .
#          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/myapp-darwin-amd64 .
#          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/myapp-darwin-arm64 .
#          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/myapp-windows-amd64.exe .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/myapp-linux-amd64
#            dist/myapp-darwin-amd64
#            dist/myapp-darwin-arm64
#            dist/myapp-windows-amd64.exe
          generate_release_notes: true # Automatically generates a changelog based on commit history
